<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" font-family="Helvetica, Arial, sans-serif">
<rect width="1280" height="820" fill="#fafafa"/>
<text x="24" y="38" font-size="22" font-weight="bold" fill="#1f1f1f">Log in and create account</text>
<text x="24" y="58" font-size="13" fill="#666666">Route: /login   |   One form with two modes (story 1).</text>
<rect x="24" y="70" width="860" height="726" fill="#ffffff" stroke="#6b6b6b" stroke-width="2"/>
<rect x="24" y="70" width="860" height="52" rx="0" fill="#f2f2f2" stroke="#8a8a8a" stroke-width="1.5"/>
<rect x="42" y="83" width="26" height="26" rx="6" fill="#bdbdbd" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="78" y="102" font-size="18" font-weight="bold" fill="#333333" text-anchor="start">Applied</text>
<text x="259.0" y="101" font-size="13" font-weight="bold" fill="#666" text-anchor="middle">My Applications</text>
<text x="399.0" y="101" font-size="13" font-weight="bold" fill="#666" text-anchor="middle">Question Bank</text>
<rect x="790" y="80" width="76" height="32" rx="6" fill="#4a4a4a" stroke="#4a4a4a" stroke-width="1.5"/>
<text x="828.0" y="101.0" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Log in</text>
<text x="64" y="154" font-size="12" font-weight="bold" fill="#777" text-anchor="start">Log in mode</text>
<rect x="64" y="170" width="370" height="400" rx="8" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="88" y="214" font-size="20" font-weight="bold" fill="#333333" text-anchor="start">Log in to Applied</text>
<rect x="88" y="232" width="240" height="7" rx="3.5" fill="#d4d4d4"/>
<text x="88" y="274" font-size="12" font-weight="bold" fill="#333333" text-anchor="start">Username</text>
<rect x="88" y="282" width="322" height="34" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="98" y="304.0" font-size="12" font-weight="normal" fill="#333333" text-anchor="start">kavya</text>
<text x="88" y="344" font-size="12" font-weight="bold" fill="#333333" text-anchor="start">Password</text>
<rect x="88" y="352" width="322" height="34" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="98" y="374.0" font-size="12" font-weight="normal" fill="#333333" text-anchor="start">••••••••</text>
<rect x="88" y="406" width="322" height="34" rx="4" fill="#f2f2f2" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="100" y="428" font-size="12" font-weight="normal" fill="#666" text-anchor="start">Incorrect username or password.</text>
<rect x="88" y="456" width="322" height="40" rx="6" fill="#4a4a4a" stroke="#4a4a4a" stroke-width="1.5"/>
<text x="249.0" y="481.0" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Log in</text>
<text x="88" y="522" font-size="13" font-weight="normal" fill="#666" text-anchor="start">New to Applied?</text>
<text x="194" y="522" font-size="13" font-weight="bold" fill="#333333" text-anchor="start">Create an account</text>
<line x1="194" y1="525" x2="316" y2="525" stroke="#333" stroke-width="1"/>
<circle cx="424" cy="180" r="12" fill="#1f1f1f"/>
<text x="424" y="185" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<circle cx="424" cy="282" r="12" fill="#1f1f1f"/>
<text x="424" y="287" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<circle cx="424" cy="408" r="12" fill="#1f1f1f"/>
<text x="424" y="413" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<circle cx="424" cy="472" r="12" fill="#1f1f1f"/>
<text x="424" y="477" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<circle cx="334" cy="517" r="12" fill="#1f1f1f"/>
<text x="334" y="522" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
<text x="464" y="154" font-size="12" font-weight="bold" fill="#777" text-anchor="start">Create account mode</text>
<rect x="464" y="170" width="370" height="470" rx="8" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="488" y="214" font-size="20" font-weight="bold" fill="#333333" text-anchor="start">Create your account</text>
<rect x="488" y="232" width="240" height="7" rx="3.5" fill="#d4d4d4"/>
<text x="488" y="274" font-size="12" font-weight="bold" fill="#333333" text-anchor="start">Username</text>
<rect x="488" y="282" width="322" height="34" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="498" y="304.0" font-size="12" font-weight="normal" fill="#333333" text-anchor="start">kavya</text>
<text x="488" y="344" font-size="12" font-weight="bold" fill="#333333" text-anchor="start">Display name</text>
<rect x="488" y="352" width="322" height="34" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="498" y="374.0" font-size="12" font-weight="normal" fill="#333333" text-anchor="start">Kavya Reddy</text>
<text x="488" y="402" font-size="11" font-weight="normal" fill="#888" text-anchor="start">Shown next to questions you share.</text>
<text x="488" y="428" font-size="12" font-weight="bold" fill="#333333" text-anchor="start">Password</text>
<rect x="488" y="436" width="322" height="34" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="498" y="458.0" font-size="12" font-weight="normal" fill="#333333" text-anchor="start">••••••••</text>
<text x="488" y="486" font-size="11" font-weight="normal" fill="#888" text-anchor="start">At least 8 characters.</text>
<rect x="488" y="504" width="322" height="34" rx="4" fill="#f2f2f2" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="500" y="526" font-size="12" font-weight="normal" fill="#666" text-anchor="start">That username is already taken.</text>
<rect x="488" y="554" width="322" height="40" rx="6" fill="#4a4a4a" stroke="#4a4a4a" stroke-width="1.5"/>
<text x="649.0" y="579.0" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Create account</text>
<text x="488" y="620" font-size="13" font-weight="normal" fill="#666" text-anchor="start">Already have an account?</text>
<text x="654" y="620" font-size="13" font-weight="bold" fill="#333333" text-anchor="start">Log in</text>
<line x1="654" y1="623" x2="696" y2="623" stroke="#333" stroke-width="1"/>
<text x="910" y="84" font-size="15" font-weight="bold" fill="#1f1f1f">Annotations</text>
<circle cx="922" cy="105" r="12" fill="#1f1f1f"/>
<text x="922" y="110" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<text x="944" y="110" font-size="14" font-weight="bold" fill="#1f1f1f">One form, two modes</text>
<text x="944" y="130" font-size="12.5" fill="#444444">Log in and Create account share one page.</text>
<text x="944" y="147" font-size="12.5" fill="#444444">The heading, fields and button text change</text>
<text x="944" y="164" font-size="12.5" fill="#444444">with the mode.</text>
<circle cx="922" cy="192" r="12" fill="#1f1f1f"/>
<text x="922" y="197" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<text x="944" y="197" font-size="14" font-weight="bold" fill="#1f1f1f">Labelled fields</text>
<text x="944" y="217" font-size="12.5" fill="#444444">Every input has a visible label above it, so</text>
<text x="944" y="234" font-size="12.5" fill="#444444">it works with screen readers and the</text>
<text x="944" y="251" font-size="12.5" fill="#444444">keyboard.</text>
<circle cx="922" cy="279" r="12" fill="#1f1f1f"/>
<text x="922" y="284" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<text x="944" y="284" font-size="14" font-weight="bold" fill="#1f1f1f">Error message</text>
<text x="944" y="304" font-size="12.5" fill="#444444">Wrong credentials or a taken username show a</text>
<text x="944" y="321" font-size="12.5" fill="#444444">clear message here, announced to screen</text>
<text x="944" y="338" font-size="12.5" fill="#444444">readers.</text>
<circle cx="922" cy="366" r="12" fill="#1f1f1f"/>
<text x="922" y="371" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<text x="944" y="371" font-size="14" font-weight="bold" fill="#1f1f1f">Primary action</text>
<text x="944" y="391" font-size="12.5" fill="#444444">Logs in or creates the account, then sends</text>
<text x="944" y="408" font-size="12.5" fill="#444444">the user to the page they were trying to</text>
<text x="944" y="425" font-size="12.5" fill="#444444">open, or to My Applications.</text>
<circle cx="922" cy="453" r="12" fill="#1f1f1f"/>
<text x="922" y="458" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
<text x="944" y="458" font-size="14" font-weight="bold" fill="#1f1f1f">Switch mode</text>
<text x="944" y="478" font-size="12.5" fill="#444444">A real button, not a link styled as one, so</text>
<text x="944" y="495" font-size="12.5" fill="#444444">it works with the keyboard.</text>
</svg>
