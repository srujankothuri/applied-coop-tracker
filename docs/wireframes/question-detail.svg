<text x="386" y="621" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
<text x="92" y="676" font-size="12" font-weight="normal" fill="#999" text-anchor="start">Logged in as the author (Arun). Other visitors see no Edit or Delete buttons.</text>
<text x="910" y="84" font-size="15" font-weight="bold" fill="#1f1f1f">Annotations</text>
<circle cx="922" cy="105" r="12" fill="#1f1f1f"/>
<text x="922" y="110" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<text x="944" y="110" font-size="14" font-weight="bold" fill="#1f1f1f">Back to results</text>
<text x="944" y="130" font-size="12.5" fill="#444444">Returns to the question bank with the same</text>
<text x="944" y="147" font-size="12.5" fill="#444444">search and filters the user had before.</text>
<circle cx="922" cy="175" r="12" fill="#1f1f1f"/>
<text x="922" y="180" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<text x="944" y="180" font-size="14" font-weight="bold" fill="#1f1f1f">Topic and difficulty</text>
<text x="944" y="200" font-size="12.5" fill="#444444">Shown as text labels at the top, so the user</text>
<text x="944" y="217" font-size="12.5" fill="#444444">knows what kind of question it is at a</text>
<text x="944" y="234" font-size="12.5" fill="#444444">glance.</text>
<circle cx="922" cy="262" r="12" fill="#1f1f1f"/>
<text x="922" y="267" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<text x="944" y="267" font-size="14" font-weight="bold" fill="#1f1f1f">The question</text>
<text x="944" y="287" font-size="12.5" fill="#444444">The page's main heading, because it is the</text>
<text x="944" y="304" font-size="12.5" fill="#444444">most important content on the page.</text>
<circle cx="922" cy="332" r="12" fill="#1f1f1f"/>
<text x="922" y="337" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<text x="944" y="337" font-size="14" font-weight="bold" fill="#1f1f1f">Interview details</text>
<text x="944" y="357" font-size="12.5" fill="#444444">Company, role, round, and who shared it and</text>
<text x="944" y="374" font-size="12.5" fill="#444444">when.</text>
<circle cx="922" cy="402" r="12" fill="#1f1f1f"/>
<text x="922" y="407" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
<text x="944" y="407" font-size="14" font-weight="bold" fill="#1f1f1f">Preparation notes</text>
<text x="944" y="427" font-size="12.5" fill="#444444">Tips from the student who was asked the</text>
<text x="944" y="444" font-size="12.5" fill="#444444">question. If there are none, the page says</text>
<text x="944" y="461" font-size="12.5" fill="#444444">so.</text>
<circle cx="922" cy="489" r="12" fill="#1f1f1f"/>
<text x="922" y="494" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
<text x="944" y="494" font-size="14" font-weight="bold" fill="#1f1f1f">Author-only actions</text>
<text x="944" y="514" font-size="12.5" fill="#444444">Edit and Delete appear only for the author.</text>
<text x="944" y="531" font-size="12.5" fill="#444444">Delete asks for confirmation. The server</text>
<text x="944" y="548" font-size="12.5" fill="#444444">also rejects changes from anyone else, and</text>
<text x="944" y="565" font-size="12.5" fill="#444444">the error appears above the buttons.</text>
