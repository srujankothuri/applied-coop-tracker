<rect x="508" y="687" width="300" height="8" rx="4.0" fill="#d4d4d4"/>
<rect x="508" y="703" width="250" height="8" rx="4.0" fill="#d4d4d4"/>
<text x="910" y="84" font-size="15" font-weight="bold" fill="#1f1f1f">Annotations</text>
<circle cx="922" cy="105" r="12" fill="#1f1f1f"/>
<text x="922" y="110" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<text x="944" y="110" font-size="14" font-weight="bold" fill="#1f1f1f">Navigation</text>
<text x="944" y="130" font-size="12.5" fill="#444444">Logged-out visitors see Log in. After login</text>
<text x="944" y="147" font-size="12.5" fill="#444444">it changes to the user's name and a Log out</text>
<text x="944" y="164" font-size="12.5" fill="#444444">button.</text>
<circle cx="922" cy="192" r="12" fill="#1f1f1f"/>
<text x="922" y="197" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<text x="944" y="197" font-size="14" font-weight="bold" fill="#1f1f1f">Purpose first</text>
<text x="944" y="217" font-size="12.5" fill="#444444">The headline and short paragraph say what</text>
<text x="944" y="234" font-size="12.5" fill="#444444">Applied does in one glance.</text>
<circle cx="922" cy="262" r="12" fill="#1f1f1f"/>
<text x="922" y="267" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<text x="944" y="267" font-size="14" font-weight="bold" fill="#1f1f1f">Main action</text>
<text x="944" y="287" font-size="12.5" fill="#444444">Goes to the login page. When logged in, it</text>
<text x="944" y="304" font-size="12.5" fill="#444444">becomes Go to my applications.</text>
<circle cx="922" cy="332" r="12" fill="#1f1f1f"/>
<text x="922" y="337" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<text x="944" y="337" font-size="14" font-weight="bold" fill="#1f1f1f">Public question bank</text>
<text x="944" y="357" font-size="12.5" fill="#444444">Anyone can browse questions without an</text>
<text x="944" y="374" font-size="12.5" fill="#444444">account.</text>
<circle cx="922" cy="402" r="12" fill="#1f1f1f"/>
<text x="922" y="407" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
<text x="944" y="407" font-size="14" font-weight="bold" fill="#1f1f1f">In-app instructions</text>
<text x="944" y="427" font-size="12.5" fill="#444444">Step-by-step instructions for both features,</text>
<text x="944" y="444" font-size="12.5" fill="#444444">so the app can be used without reading the</text>
<text x="944" y="461" font-size="12.5" fill="#444444">README.</text>
