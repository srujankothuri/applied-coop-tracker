<text x="944" y="110" font-size="14" font-weight="bold" fill="#1f1f1f">Share a question</text>
<text x="944" y="130" font-size="12.5" fill="#444444">Opens the question form. Logged-out visitors</text>
<text x="944" y="147" font-size="12.5" fill="#444444">see Log in to share a question instead.</text>
<circle cx="922" cy="175" r="12" fill="#1f1f1f"/>
<text x="922" y="180" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<text x="944" y="180" font-size="14" font-weight="bold" fill="#1f1f1f">Keyword search</text>
<text x="944" y="200" font-size="12.5" fill="#444444">Searches the question text and preparation</text>
<text x="944" y="217" font-size="12.5" fill="#444444">notes. Results update shortly after the user</text>
<text x="944" y="234" font-size="12.5" fill="#444444">stops typing.</text>
<circle cx="922" cy="262" r="12" fill="#1f1f1f"/>
<text x="922" y="267" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<text x="944" y="267" font-size="14" font-weight="bold" fill="#1f1f1f">Filters</text>
<text x="944" y="287" font-size="12.5" fill="#444444">Company, topic, difficulty and round</text>
<text x="944" y="304" font-size="12.5" fill="#444444">dropdowns, plus sorting. The company list</text>
<text x="944" y="321" font-size="12.5" fill="#444444">comes from the questions in the database.</text>
<circle cx="922" cy="349" r="12" fill="#1f1f1f"/>
<text x="922" y="354" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<text x="944" y="354" font-size="14" font-weight="bold" fill="#1f1f1f">Only my questions</text>
<text x="944" y="374" font-size="12.5" fill="#444444">Shown only when logged in. Lists the</text>
<text x="944" y="391" font-size="12.5" fill="#444444">questions this user shared, so they can find</text>
<text x="944" y="408" font-size="12.5" fill="#444444">them to edit or delete.</text>
<circle cx="922" cy="436" r="12" fill="#1f1f1f"/>
<text x="922" y="441" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
<text x="944" y="441" font-size="14" font-weight="bold" fill="#1f1f1f">Result count</text>
<text x="944" y="461" font-size="12.5" fill="#444444">Updates with every search and is announced</text>
<text x="944" y="478" font-size="12.5" fill="#444444">to screen readers.</text>
<circle cx="922" cy="506" r="12" fill="#1f1f1f"/>
<text x="922" y="511" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
<text x="944" y="511" font-size="14" font-weight="bold" fill="#1f1f1f">Question card</text>
<text x="944" y="531" font-size="12.5" fill="#444444">The question text is a link to its detail</text>
<text x="944" y="548" font-size="12.5" fill="#444444">page. The card shows company, role, round,</text>
<text x="944" y="565" font-size="12.5" fill="#444444">topic and who shared it.</text>
<circle cx="922" cy="593" r="12" fill="#1f1f1f"/>
<text x="922" y="598" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
<text x="944" y="598" font-size="14" font-weight="bold" fill="#1f1f1f">Difficulty label</text>
<text x="944" y="618" font-size="12.5" fill="#444444">Easy, Medium or Hard written as text, not</text>
<text x="944" y="635" font-size="12.5" fill="#444444">shown by color alone.</text>
<circle cx="922" cy="663" r="12" fill="#1f1f1f"/>
<text x="922" y="668" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">8</text>
<text x="944" y="668" font-size="14" font-weight="bold" fill="#1f1f1f">Pagination</text>
<text x="944" y="688" font-size="12.5" fill="#444444">20 questions per page. Filters and page</text>
<text x="944" y="705" font-size="12.5" fill="#444444">number live in the URL, so a search can be</text>
<text x="944" y="722" font-size="12.5" fill="#444444">bookmarked and Back works.</text>
