<text x="922" y="110" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<text x="944" y="110" font-size="14" font-weight="bold" fill="#1f1f1f">Count</text>
<text x="944" y="130" font-size="12.5" fill="#444444">Shows how many applications match the</text>
<text x="944" y="147" font-size="12.5" fill="#444444">current filters.</text>
<circle cx="922" cy="175" r="12" fill="#1f1f1f"/>
<text x="922" y="180" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<text x="944" y="180" font-size="14" font-weight="bold" fill="#1f1f1f">Add application</text>
<text x="944" y="200" font-size="12.5" fill="#444444">Opens the application form above the board</text>
<text x="944" y="217" font-size="12.5" fill="#444444">(see the next wireframe).</text>
<circle cx="922" cy="245" r="12" fill="#1f1f1f"/>
<text x="922" y="250" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<text x="944" y="250" font-size="14" font-weight="bold" fill="#1f1f1f">Filter bar</text>
<text x="944" y="270" font-size="12.5" fill="#444444">Company, role, status and date range.</text>
<text x="944" y="287" font-size="12.5" fill="#444444">Results update as the user types, with a</text>
<text x="944" y="304" font-size="12.5" fill="#444444">short delay. Clear filters resets them.</text>
<circle cx="922" cy="332" r="12" fill="#1f1f1f"/>
<text x="922" y="337" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<text x="944" y="337" font-size="14" font-weight="bold" fill="#1f1f1f">One column per status</text>
<text x="944" y="357" font-size="12.5" fill="#444444">Applied, Interviewing, Offer, Rejected, each</text>
<text x="944" y="374" font-size="12.5" fill="#444444">with a count. Status is shown by the column</text>
<text x="944" y="391" font-size="12.5" fill="#444444">title in text, not by color alone.</text>
<circle cx="922" cy="419" r="12" fill="#1f1f1f"/>
<text x="922" y="424" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
<text x="944" y="424" font-size="14" font-weight="bold" fill="#1f1f1f">Move to buttons</text>
<text x="944" y="444" font-size="12.5" fill="#444444">Change the status with one click. Real</text>
<text x="944" y="461" font-size="12.5" fill="#444444">buttons instead of drag-and-drop, so the</text>
<text x="944" y="478" font-size="12.5" fill="#444444">board works with the keyboard.</text>
<circle cx="922" cy="506" r="12" fill="#1f1f1f"/>
<text x="922" y="511" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
<text x="944" y="511" font-size="14" font-weight="bold" fill="#1f1f1f">Edit and Delete</text>
<text x="944" y="531" font-size="12.5" fill="#444444">Edit opens the form with the card's values.</text>
<text x="944" y="548" font-size="12.5" fill="#444444">Delete asks for confirmation first.</text>
<circle cx="922" cy="576" r="12" fill="#1f1f1f"/>
<text x="922" y="581" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
<text x="944" y="581" font-size="14" font-weight="bold" fill="#1f1f1f">Empty column</text>
<text x="944" y="601" font-size="12.5" fill="#444444">Says there is nothing here instead of</text>
<text x="944" y="618" font-size="12.5" fill="#444444">showing a blank space.</text>
